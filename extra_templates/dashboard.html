<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    /* Dashboard Heading */
    .main-heading {
      text-align: center;
      font-size: 3em;
      font-weight: bold;
      color: black;
      margin-top: 20px;
      animation: headingAnimation 1.5s ease-out;
    }

    @keyframes headingAnimation {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Box Layout */
    .box-container {
      display: flex;
      justify-content: space-evenly; /* Ensures even spacing between boxes */
      align-items: center; /* Vertically centers the boxes */
      margin-top: 20px;
      max-width: 1300px; /* Controls max width of the container */
      width: 100%;
      padding: 20px;
    }

    .box {
      position: relative;
      width: 500px;  /* Rectangular width */
      height: 250px; /* Rectangular height */
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-color: rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      animation-duration: 1s;
      animation-fill-mode: both;
      margin: 0 20px; /* Adds space between boxes */
    }

    .box img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(70%);
    }

    .box-content {
      position: relative;
      z-index: 1;
      color: white; /* Changed text color to white */
      font-size: 1.5em;
      font-weight: bold;
    }

    /* Animation for Boxes */
    .box:nth-child(1) {
      animation-name: slideFromTop;
    }

    .box:nth-child(2) {
      animation-name: slideFromBottom;
    }

    .box:nth-child(3) {
      animation-name: slideFromTop;
    }

    @keyframes slideFromTop {
      0% {
        transform: translateY(-200px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes slideFromBottom {
      0% {
        transform: translateY(200px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Next Button */
    .next-btn {
      display: block;
      width: 150px;
      margin: 30px auto;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      font-size: 1.2em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.3s ease;
    }

    .next-btn:hover {
      background-color: #45a049;
    }

  </style>
</head>
<body>
  <!-- Main Heading -->
  <div class="main-heading">
    Dashboard
  </div>

  <!-- Box Container -->
  <div class="box-container">
    <!-- Room ID Box -->
    <div class="box">
      <img src="{{ url_for('static', filename='images/room.jpg') }}" alt="Room ID">
      <div class="box-content">
        Room ID: <span id="room-id">QUIZ-12345</span>
      </div>
    </div>

    <!-- Time Limit Box -->
    <div class="box">
      <img src="{{ url_for('static', filename='images/time.jpg') }}" alt="Time Limit">
      <div class="box-content">
        Time Limit: 
        <input type="number" id="time-limit" min="5" max="300" placeholder="30" onchange="updateTimeLimit()">
        seconds
      </div>
    </div>

    <!-- Questions Info Box -->
    <div class="box">
      <img src="{{ url_for('static', filename='images/duration.jpg') }}" alt="Questions Info">
      <div class="box-content">
        Questions: <span id="num-questions">10</span><br>
        Total Time: <span id="total-time">300</span> seconds
      </div>
    </div>
  </div>

  <!-- Next Button -->
  <button class="next-btn" onclick="window.location.href='/next_page_url'">Next</button>

  <script>
    // Example: Generate Room ID dynamically
    function generateRoomID() {
      const roomID = `QUIZ-${Math.floor(1000 + Math.random() * 9000)}`;
      document.getElementById('room-id').textContent = roomID;
    }

    // Update Time Limit and Total Time
    function updateTimeLimit() {
      const timeLimit = document.getElementById('time-limit').value;
      document.getElementById('total-time').textContent = timeLimit * 10; // Assuming each question takes ~10 seconds.
    }

    // Initialize Room ID and Time Limit
    document.addEventListener("DOMContentLoaded", () => {
      generateRoomID();
      updateTimeLimit();
    });
  </script>
</body>
</html>
