<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Room</title>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client/dist/socket.io.min.js"></script>
    <style>
        body {   
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        .container {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            width: 400px;
            text-align: center;
        }

        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border-radius: 5px;
            border: none;
            outline: none;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            background-color: #28a745;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #218838;
        }

        .room-info, .participants-list {
            margin-top: 20px;
            text-align: left;
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 5px 0;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Room</h1>

        <!-- Room creation form -->
        <div id="create-room-form">
            <input type="text" id="host_name" placeholder="Enter Your Name" required>
            <button id="create-room-button">Create Room</button>
        </div>

        <!-- Room info -->
        <div id="room-info" class="hidden">
            <p><strong>Room ID:</strong> <span id="room-id"></span></p>
            <p><strong>Host Name:</strong> <span id="host-name"></span></p>
        </div>

        <!-- Participants list -->
        <div class="participants-list hidden" id="participants-container">
            <h3>Participants</h3>
            <ul id="participants-list"></ul>
        </div>
    </div>

    <script>
        const socket = io.connect('http://' + document.domain + ':' + location.port);

        const createRoomButton = document.getElementById('create-room-button');
        const createRoomForm = document.getElementById('create-room-form');
        const roomInfo = document.getElementById('room-info');
        const participantsContainer = document.getElementById('participants-container');
        const participantsList = document.getElementById('participants-list');
        const roomIdDisplay = document.getElementById('room-id');
        const hostNameDisplay = document.getElementById('host-name');

        createRoomButton.addEventListener('click', () => {
            const hostName = document.getElementById('host_name').value.trim();

            if (!hostName) {
                alert('Please enter your name.');
                return;
            }

            // Emit event to create room
            socket.emit('create_room', { host_name: hostName });

            // Hide the form and show room info
            createRoomForm.classList.add('hidden');
            roomInfo.classList.remove('hidden');
            participantsContainer.classList.remove('hidden');

            // Display host name
            hostNameDisplay.textContent = hostName;
        });

        // Listen for room created event
        socket.on('room_created', (data) => {
            roomIdDisplay.textContent = data.room_id; // Unique room ID generated by the server
        });

        // Listen for new participant event
        socket.on('participant_joined', (data) => {
            const participant = document.createElement('li');
            participant.textContent = data.name; // Name of the participant
            participantsList.appendChild(participant);
        });
    </script>
</body>
</html>
