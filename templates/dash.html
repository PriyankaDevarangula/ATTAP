<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Page</title>
  <style>
    /* General Styles */
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #bcb6c343; /* Peach Light Brown */
      color: #333;
      overflow: hidden; /* Hide overflow for animations */
    }

    /* Header Section */
    .header {
      background-color: #bcb6c343; /* Peach Red */
      padding: 20px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
    }

    .logo {
      margin-right: 50px;
    }

    .navbar {
      display: flex;
      align-items: center;
    }

    .nav-links {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      gap: 70px;
    }

    .nav-button {
      text-decoration: none;
      font-family: 'Calibri', sans-serif;
      font-size: 22px;
      font-weight: bold;
      color: #333;
      position: relative;
      padding: 10px;
      transition: all 0.3s ease-in-out;
    }

    .nav-button:hover {
      color: #020202;
    }

    .nav-button::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 2px;
      background-color: #070707;
      transition: width 0.3s ease-in-out;
    }

    .nav-button:hover::after {
      width: 100%;
    }

    /* Welcome Section */
    .welcome-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: calc(100vh - 80px);
      padding: 20px;
      text-align: center;
    }

    .welcome-text {
      flex: 1;
      padding: 30px;
      text-align: center;
    }

    .welcome-text h1 {
      font-size: 5rem;
      margin-bottom: 10px;
    }

    .welcome-text p {
      font-size: 1.3rem;
      color: #555;
    }

    .get-started-button {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background-color: #d0d3f2;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 30px;
    }

    .get-started-button:hover {
      background-color: #bcc4da;
    }

    /* Animated Image Section */
    .image-section {
      flex: 1;
      background-image: url('{{ url_for('static', filename='images/wel1.jpg') }}');
      background-size: cover;
      background-position: center;
      height: 400px;
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      opacity: 0;
      transform: translateY(100px);
      animation: slideUp 1.5s ease-out forwards;
    }

    /* Animation Keyframes */
    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" width="100">
    </div>
    <nav class="navbar">
      <ul class="nav-links">
        <li><a href="#home" class="nav-button">Home</a></li>
        <li><a href="#about" class="nav-button">About</a></li>
        <li><a href="#contact" class="nav-button">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="welcome-section">
    <div class="welcome-text">
      <h1>WELCOME..!</h1>
      <p>Crack Questions, Smash Code: Your Game Awaits!</p>
      <button class="get-started-button" onclick="window.location.href='/game_selection'">Get Started</button>
    </div>
    <div class="image-section"></div>
  </section>
</body>
</html>
